services:
  app:
    build: .
    container_name: serverunning
    image: aulaserver
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=${PORT}
      - CLIURL=${CLIURL}
      - API=${API}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - STORAGE=${STORAGE}
    volumes:
      - .:/app
      - /app/node_modules 
      - ../drive:/drive
    networks:
      - app-network
      - main_default

networks:
  app-network:
    driver: bridge
  main_default:
    external: true
