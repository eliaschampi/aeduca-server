version: '3.9'
services:
  app:
    build: .
    ports:
      - '3000:3000'
    depends_on:
      - mongodb
    networks:
      - app-network
  mongodb:
    container_name: servermongo
    image: mongo:latest
    environment:
      - MONGO_INITDB_DATABASE=aeduca
      - MONGO_INITDB_ROOT_USERNAME=elias
      - MONGO_INITDB_ROOT_PASSWORD=doky
    volumes:
      - ./mongodata:/data/db
    ports:
      - '27017:27017'
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
