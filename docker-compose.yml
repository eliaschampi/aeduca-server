services:
  app:
    build: .
    container_name: serverunning
    image: aulaserver
    ports:
      - "3000:3000"
    environment:
      - PORT=${PORT}
      - CLIURL=${CLIURL}   # ajusta al frontend real
      - API=${API}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - STORAGE=${STORAGE}
    volumes:
      - .:/app              # montar código local (hot reload)
      - /app/node_modules   # volumen anónimo para deps (no se pisan)
      - ./drive:/app/drive  # montar directorio de archivos
    networks:
      - app-network
      - aeduca-main_default

networks:
  app-network:
    driver: bridge
  aeduca-main_default:
    external: true
